[build]
  command = "npm install"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["db/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[build.environment]
  NODE_VERSION = "18"
  NIXPKGS_ALLOW_UNFREE = "1"

[[plugins]]
package = "@netlify/plugin-nixpkgs"

  [plugins.inputs]
  packages = ["postgresql"]