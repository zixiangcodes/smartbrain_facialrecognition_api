[build]
  command = "apt-get update && apt-get install -y postgresql postgresql-contrib && npm install"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["db/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[build.environment]
  NODE_VERSION = "18"